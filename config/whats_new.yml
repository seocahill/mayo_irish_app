# What's new, shown to learners once each (see app/models/whats_new.rb).
#
# Add a note in the same change as the feature it describes, for anything a
# learner can see or feel. Plain English, one or two sentences, no jargon.
#
#   id:    the next whole number; never reuse or reorder (a learner's "read up to"
#          marker is the highest id they have seen)
#   date:  the day it shipped. Learners who joined after this day never see it.
#   title: a few words
#   body:  what changed and why it helps them
#   path:  optional, an app path to try it (must be a real route)
#
# Newest last is fine; they are shown newest first.
- id: 1
  date: 2026-11-14
  title: One daily review across all your lessons
  body: Your review now draws on every lesson you've studied and brings each word
    back around when it's due, so you don't have to remember which lesson to revisit.
  path: /review
- id: 2
  date: 2026-11-14
  title: Ask the course a question
  body: Type or say a question in plain English, like how to say a number or why a
    word changes, and get an answer drawn from the lessons. It's written by AI, so
    check it against the lesson.
  path: /ask/new
- id: 3
  date: 2026-11-14
  title: Say it, then check
  body: Words you've already got right once now come back as "Say it" cards. Say the
    Irish aloud (or listen to the Mayo speaker and say what it means), tap Show, then
    rate how it went. You can also hear the Mayo speaker on quiz questions and answers.
  path: /review
- id: 4
  date: 2026-11-14
  title: Repeat a phrase
  body: On a listening clip, tap Repeat and the Mayo speaker's phrase plays over and
    over until you've caught it. Slower is still there too.
  path: /listens
- id: 5
  date: 2026-11-14
  title: See what's coming
  body: Under "So far" on Today you can now see how many reviews are due tomorrow and
    over the coming week, so you can plan your time.
  path: /
- id: 6
  date: 2026-11-15
  title: Repeat a line in a conversation
  body: In a recording, tap Repeat line while a line plays and the Mayo speaker says it
    over and over until you've caught it. Tap another line to move on.
  path: /listens
- id: 7
  date: 2026-11-15
  title: See how far you've got
  body: Under "So far" on Today you now see the words you know, the time you've spent
    listening to Mayo speakers, and your longest conversation, with the next step for
    each. It's just what you've done, with no points or streaks.
  path: /
- id: 8
  date: 2026-11-15
  title: Genitive beside the plural
  body: Vocabulary lists now have a Genitive column next to the plural, so you can
    learn the gender, genitive and plural together with each noun. It fills in as the
    course designers add the forms.
  path: /lessons
- id: 9
  date: 2026-11-15
  title: Slower and repeat on lesson audio
  body: Audio inside a lesson now has Slower and Repeat buttons, the same as on
    the Listen pages, so you can work out fast speech at your own pace.
  path: /lessons
- id: 10
  date: 2026-11-15
  title: Tabs at the bottom on your phone
  body: Today, Lessons, Ask and Search now sit in a bar at the bottom of the screen
    on a phone, easy to reach with your thumb. Sign out is at the foot of the page.
  path: /lessons
- id: 11
  date: 2026-11-16
  title: Phrases in your review
  body: Short phrases from each lesson now come up in the quiz and the daily review
    alongside the words, so you practise whole bits of speech and not only single
    words.
  path: /review
- id: 12
  date: 2026-11-16
  title: Grammar in your progress
  body: Under "So far" on Today you now also see how many lessons' grammar you've
    used in conversation with the tutor, with the next step. Still no points or streaks.
  path: /
- id: 13
  date: 2026-11-16
  title: Pick the time you have
  body: Each step on Today now says roughly how long it takes, and you can choose
    5, 10 or 20 minutes to see just the steps that fit.
  path: /
- id: 14
  date: 2026-11-17
  title: Next steps are links
  body: Under "So far" on Today, the "next" step on each line now takes you straight
    to where you can reach it, whether that is your review, your listening or the lessons.
  path: /
- id: 15
  date: 2026-11-17
  title: Where a form comes from
  body: When a plural or genitive in a lesson's word list was taken from native speech
    recorded on Abairt, it now carries a small "Abairt" marker, so you can see it
    is attested and not guessed.
  path: /lessons
- id: 16
  date: 2026-11-17
  title: Plurals and genitives on your phone
  body: In a lesson's word list, the genitive and plural of each noun now show under
    the word on a phone, where before they only appeared on wider screens.
  path: /lessons
- id: 17
  date: 2026-11-18
  title: Words to look at again
  body: At the end of a review round you now see the words you missed, with their
    meaning and a recording to listen to, before you carry on.
  path: /review
- id: 18
  date: 2026-11-19
  title: Back to the lesson from a missed word
  body: The words you missed at the end of a review round now link to the lesson that
    teaches them, so you can see them in context.
  path: /review
- id: 19
  date: 2026-11-19
  title: See which lessons have words to review
  body: The course list now shows, under each lesson, how many review cards are
    due.
  path: /lessons
- id: 20
  date: 2026-11-20
  title: What to do after a review
  body: When a review round ends, or when nothing is due, you now see the next step
    on your daily path right there.
  path: /review
- id: 21
  date: 2026-11-20
  title: Your words, out of the whole course
  body: Under So far, the words you know are now shown against all the words in the
    course, so you can see how far along you are.
  path: /
- id: 22
  date: 2026-11-20
  title: Listening this week
  body: Under So far, the minutes you have listened now show how many were this week,
    like your speaking does.
  path: /
- id: 23
  date: 2026-11-20
  title: Reviews this week
  body: Under So far, you now see how many review answers you have given this week.
  path: /
- id: 24
  date: 2026-11-20
  title: How many you got right
  body: Next to your review answers this week, you now see how many of them you got right.
  path: /
- id: 25
  date: 2026-11-21
  title: Where a word comes from
  body: Some words in a lesson now show a small note on where they come from, such as the book and page or the speaker.
  path: /lessons
- id: 26
  date: 2026-11-21
  title: Words to watch
  body: When you keep missing the same words in review, they now appear at the end of a round, with a link back to the lesson.
  path: /review
- id: 27
  date: 2026-11-22
  title: A word's forms in review
  body: After you answer a review card for a noun, you now see whether it is masculine or feminine, and its genitive and plural where the course has them.
  path: /review
- id: 28
  date: 2026-11-22
  title: See which words you know
  body: In a lesson's word list, a small tick now marks each word you already know, so you can see what is left to learn.
  path: /lessons
- id: 29
  date: 2026-11-22
  title: Your weeks
  body: Under So far on Today, Your weeks shows what you did in each of the last eight weeks, so you can look back and see how it adds up.
  path: /weeks
- id: 30
  date: 2026-11-22
  title: Hear yourself on Say it cards
  body: After you tap Show on a Say it card, you can record yourself and play it back next to the Mayo speaker. The recording stays on your phone and is never uploaded.
  path: /review
- id: 31
  date: 2026-11-22
  title: Say it after the speaker
  body: On a listening clip, open Show the words and you can now record yourself saying the phrase, then play it back to compare with the Mayo speaker. The recording stays on your phone and is never uploaded.
  path: /listens
- id: 32
  date: 2026-11-22
  title: Lessons that open without signal
  body: The last ten lessons you opened are kept on this device, so they still open when your connection drops. Recordings and practice still need a connection. Signing out clears them.
  path: /lessons
- id: 33
  date: 2026-11-22
  title: Listen with the screen locked
  body: A whole conversation now shows its title and speakers on your lock screen. The lock-screen and headphone buttons skip back or forward ten seconds, and when the conversation has a transcript, previous and next (where your phone or headphones have them) jump to the line before or after, so you can catch a line again without unlocking your phone.
  path: /listens
- id: 34
  date: 2026-11-22
  title: Carry on where you stopped
  body: If you leave a whole conversation part way through, it now offers to carry on from where you stopped the next time you open it. Your place is kept only on this phone or computer, and signing out forgets it.
  path: /listens
- id: 35
  date: 2026-11-22
  title: Machine voice or Mayo speaker, at a glance
  body: Wherever a word is read by ABAIR's synthetic voice rather than a recording of a speaker, it now says so on the page, with a "Synthetic" tag beside each word's button and a note above the lesson text, so you can always tell the two apart on a phone. The tutor chat (Practise) now marks each reply as AI-generated, like the conversation does.
  path: /lessons
- id: 36
  date: 2026-11-22
  title: Listen first, then read
  body: On a whole conversation you can now tap "Hide Irish" to listen with the Irish words hidden. Each line stays as a blank bar you can still tap to hear again, and tapping it again brings the words back. This phone or computer remembers your choice.
- id: 37
  date: 2026-11-22
  title: Back 5 seconds
  body: Every player now has a "Back 5 s" button, so catching a word you missed takes one tap. On a computer, Space plays or pauses, and the left and right arrow keys go back or forward five seconds.
  path: /listens
- id: 38
  date: 2026-11-22
  title: Choose your listening speed
  body: The "Slower" button is now a speed button. Tap it to go from 1× to 0.9× to 0.75× and back. This phone or computer remembers your speed and uses it on every recording, clip and word you play, until you change it again. The voice keeps its pitch.
  path: /listens
- id: 39
  date: 2026-11-22
  title: Recording yourself counts as speaking
  body: When you record yourself on a Say it card, after a listening clip or on a lesson's word list, that time now counts towards your minutes spoken on Today and on Your weeks. Only the length is counted. The recording itself never leaves your phone or computer.
  path: /weeks
- id: 40
  date: 2026-11-22
  title: Type what you hear
  body: On a listening clip you can now type what you think the speaker said and tap Check. You'll see the speaker's words with the ones you heard, heard differently or missed marked, and the English. Missing fadas don't count against you. It's optional, and you still say how it went yourself.
  path: /listens
- id: 41
  date: 2026-11-23
  title: Listening clips count as listening
  body: Time you spend playing a listening clip, over and over with Repeat too, now counts towards your minutes listened on Today, So far and Your weeks, like whole conversations do. Only time the clip is actually playing counts.
  path: /weeks
- id: 42
  date: 2026-11-23
  title: Lesson audio counts as listening
  body: Listening to the audio on a lesson's page, with Repeat too, now counts towards your minutes listened on Today, So far and Your weeks, like listening clips and whole conversations. Only time the audio is actually playing counts.
  path: /lessons
- id: 43
  date: 2026-11-23
  title: See what the recogniser heard
  body: In a lesson's conversation, what you say aloud now shows as "Heard as", so you can tell it's what ABAIR's speech recogniser made of your words, not a word-for-word record. It can mishear Mayo forms, so it isn't a mark of how well you spoke. Typed turns look the same as before.
  path: /lessons
- id: 44
  date: 2026-11-23
  title: Answer the tutor aloud
  body: In a lesson's Practise chat you can now tap the microphone and say your answer in Irish instead of typing it. ABAIR's speech recogniser writes down what it heard and sends that to the tutor, marked "Heard as". The time you spoke counts towards your minutes spoken. The recogniser only knows Irish, so keep typing answers in English.
  path: /lessons
- id: 45
  date: 2026-11-23
  title: Hear what came of your question
  body: On Ask a native speaker, a question now says when a course designer has saved it to help improve the course, and later when it is used to change the course. Your questions to native speakers shape the lessons.
  path: /native_questions
- id: 46
  date: 2026-11-23
  title: Hear the Irish in the tutor chat
  body: In a lesson's Practise chat, select any Irish, in the tutor's replies or your own answers, and tap "Hear it" to hear it read aloud. It's ABAIR's synthetic voice, not a Mayo speaker, so use it to get a feel for the sounds and check against the lesson's recordings.
  path: /lessons
- id: 47
  date: 2026-11-23
  title: Phrases you made out
  body: Today's "So far" now counts the phrases from Mayo speakers you made out. Each listening clip where you tapped "I got it" counts once. It's your own word, not a test, so it's a record of what you can follow, not a score.
  path: /
- id: 48
  date: 2026-11-23
  title: Say whether you followed a conversation
  body: At the end of a whole conversation from a Mayo speaker there's now "Did you follow it?". Tap "I followed it" when you could keep up with what was said, even with a few words missed, or "Not yet". It's your own word, not a test, and Your listening shows it next to each conversation.
  path: /listens
- id: 49
  date: 2026-11-23
  title: Conversations you followed
  body: Today's "So far" now counts the whole conversations from Mayo speakers you said you followed, at the end of each one. It's your own word, not a test.
  path: /
- id: 50
  date: 2026-11-24
  title: Exercises come back in your daily review
  body: The exercises editors have answered in Mayo Irish now come back in the daily review, so the grammar they practise comes round again before you forget it. Say or write your Irish, tap Show to see the editors' answer, and rate yourself. At most one new exercise joins a round.
  path: /review
- id: 51
  date: 2026-11-24
  title: Exercises you know
  body: Today's "So far" now counts the exercises you know from your daily review. It's your own rating, not a test. An exercise counts once you've rated it Good or Easy over a week or more, the same bar as a known word, so one lucky answer isn't enough.
  path: /
- id: 52
  date: 2026-11-24
  title: Plurals and genitives in your daily review
  body: Irish plurals and genitives don't follow simple rules, so they are worth learning with the word. Once you know what a noun means, its plural and genitive from the course now come back in the daily review as their own cards. Say the form aloud, tap Show to see it, and rate yourself. At most one new form joins a round, and they don't change your count of words known.
  path: /review
- id: 53
  date: 2026-11-24
  title: Plurals and genitives you know
  body: Today's "So far" now counts the plurals and genitives you know from your daily review. It's your own rating, not a test, and it's kept apart from your words known. A form counts once you've rated it Good or Easy over a week or more, the same bar as a known word.
  path: /
