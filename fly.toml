# fly.toml app configuration file generated for mayo-irish-app on 2026-04-12T18:16:24+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mayo-irish-app'
primary_region = 'lhr'
console_command = '/rails/bin/rails console'
# Rails uses about 200MB; swap covers the odd spike on the 512MB machine.
swap_size_mb = 512

[deploy]
  release_command = "bash -c '/rails/bin/rails db:migrate'"

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Production stays awake, so learners never wait for it to start and the
  # hourly listening clip search can run. The preview (beta) app sleeps when
  # idle; its deploy turns stopping back on (see fly-preview.yml).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = '/rails/public'
  url_prefix = '/'
