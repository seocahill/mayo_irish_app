    lesson_type: dias_material
    source: "IE"
    scans: "scans/erris_front/Irish_of_Erris_1_1.pdf spreads 12-20 (pp. 8-23; verified exact against printed page numbers)"
    pages: "8-23"
    paragraphs: "§§24-103"
    structure: >
      Three grammar_rules: (1) The vowel phonemes: quality and length
      §§24-74 (pp.8-19) — six grammar_sections, one per phoneme: /i//i:/,
      /e//e:/, /a//a:/, /o//o:/, /u//u:/, /ə/. (2) Nasalised vowels §§75-87
      (pp.19-20) — sections for the five nasalised phonemes and the
      Faulmore/Doohoma open ã: diaphonic variant (§83, district
      attribution). (3) The falling diphthongs §§88-103 (pp.21-23) —
      sections per diphthong /iə/, /uə/, /əi/, /əu/. Six vocabulary_items
      for notable phoneme-boundary overlaps (agus, bior, ceird, coirce,
      sgeallán, raibh). Three phrases (cá bhfuil sé?, go deó, ar ball).
      Two lesson_blocks: source/notation recap + a short aside on
      consonant-conditioned vowel quality and phoneme overlap.
    notes: >
      Chapter boundary confirmed precisely: Chapter II (Phonetic
      Description of Vowels) runs pp.8-20 §§24-87, Chapter III (Diphthongs)
      pp.21-23 §§88-103, and Chapter IV (Consonants) begins exactly at
      p.24/§104 — the clean start point for the next queue unit
      (erris-consonant-phonemes). This unit picks up immediately where
      erris-intro-notation left off (that lesson ended at p.7/§23).
      Content is dense (80 numbered paragraphs across 16 pages); example
      tables were curated to representative environments rather than
      reproducing every example word in the source, per the
      accuracy-over-coverage policy. Schema note: vocabulary_items'
      `gender` field defaulted to "m" server-side for all six records even
      though gender was not set in the create call and several of the
      words are not straightforwardly gendered nouns (e.g. raibh, a verb
      form) — flagged for human review, not corrected here since gender
      isn't in the writable-fields list we control.

