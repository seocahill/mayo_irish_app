    structure: >
      Six grammar_rules: (1) the mutation system + master consonant table
      §§483-485 — 18 rows basic/lenited/eclipsed incl. sʟ→hl, ʃʟ′→hl′,
      sɴ→hn, ʃɴ′→hn′, ʃr→hr, tr→dr, tr′→dr′, and the exemptions (initial h;
