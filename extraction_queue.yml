    lesson_title: "Initial Mutation in Erris"
    lesson_type: dias_material
    source: "IE (Mhac an Fhailigh, The Irish of Erris)"
    scans: "scans/erris_3/ spreads 20-23 (N.jpeg ≈ pp. 130+2N; verify printed page numbers)"
    pages: "170-177"
    paragraphs: "§§482-495"
    structure: >
      Six grammar_rules: (1) the mutation system + master consonant table
      §§483-485 — 18 rows basic/lenited/eclipsed incl. sʟ→hl, ʃʟ′→hl′,
      sɴ→hn, ʃɴ′→hn′, ʃr→hr, tr→dr, tr′→dr′, and the exemptions (initial h;
      s/ʃ before b,d,g,m; ḍ ṭ). (2) Lenition of nouns §486 — all 14 numbered
      environments as sections, incl. the article s→t rule and the ar-phrase
      non-lenition list (ar ball, ar cuairt, ar maidin…) and gan/idir/thar
      behaviour. (3) Lenition of adjectives §487 (environments i-ix incl.
      dual and budh). (4) Lenition of verbs §488 + adverbs & prepositions
      §489 (lenited adverb list; chugam/dhíom/liom pronominal forms).
      (5) Eclipsis: nouns §490 (six environments), verbs §491.
      (6) Provection: h §492 (nouns/adjectives/pronouns/verbs), t §493,
      ɴ/n §494, j §495 (incl. Dú Chaocháin vs Faulmore variation).
      Blocks: source/notation block + short asides. Phrases: any idiomatic
      examples worth first-class records (e.g. lé haghaidh, lé chéile).
    notes: "Most learner-critical chapter in the grammar. Dense examples — carry phonetics faithfully."

