      chapter (pronoun-subject vs. noun-subject/no-subject forms, slant-line
      notation). (2) Monosyllabic stems §§575-582 — full paradigm of caillim
      as the model verb (all tenses/moods incl. rel., pass., pret.); caithim
      and other group (i)/(ii)/(iii) verbs (stems in ç/j/w-diphthong) given
      more compactly; léighim as a second fully-paradigmed model;
      snámhaim/treabhaim noted as conjugating like the w-diphthong group.
      (3) Irregular verbs, first six: beirim (fut. stem, pret. rug), cluinim
      (pret. + interrogative + vn. irregularities only), deánaim (Faulmore
      pret. rinne, dependent forms), deirim (rel./frequentative/dependent
      forms), faghaim (dependent wi:-/fhuigh- stem, Faulmore variant),
      fágbhaim (pret. only, otherwise regular) — §§583-588, pp.208-211.
      Suggest one grammar_rule for (1)+(2) with each major conjugation class
      as a grammar_section (the caillim table is the centerpiece — reproduce
      in full given its role as the model paradigm), one grammar_rule for
      (3) with one grammar_section per irregular verb.
