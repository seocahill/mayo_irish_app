version: 2
updates:
  # Patch and minor bumps arrive as one grouped PR per ecosystem per week (the
  # builder merges it on green). Major bumps stay separate, one PR each.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
