# Runs on every pull request and on main. `test` and `security` are required
# status checks for main, so a PR can only (auto-)merge once both are green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04 # Pinned: ruby/setup-ruby has no prebuilt Ruby 3.4.2 on ubuntu-26.04 (latest)
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # test:prepare also builds the Tailwind stylesheet the layouts link to.
      - name: Run tests
        run: bin/rails db:test:prepare test

  security:
    runs-on: ubuntu-24.04 # Pinned: ruby/setup-ruby has no prebuilt Ruby 3.4.2 on ubuntu-26.04 (latest)
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan Rails code for security vulnerabilities
        run: bundle exec brakeman --no-pager

      - name: Scan importmap JavaScript dependencies for known vulnerabilities
        run: bin/importmap audit
